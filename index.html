/* =====================================================================
   CANVAS FIELDS
   structure: document fragments assembling into a table (hero visual)
   grid:      a dot lattice with signals running along it (Work door)
   flow:      ink-like strokes drifting through a field (Personal door)
   Each one pauses offscreen and in hidden tabs, and draws a single
   still frame when reduced motion is on.
   ===================================================================== */
function field(cv,kind){
  var ctx=cv.getContext('2d'),W=0,H=0,dpr=1,raf=0,vis=false,col={},px=-9999,py=-9999,t0=performance.now(),parts=[],seeded=false;
  function readCol(){var cs=getComputedStyle(cv);col={ink:cs.getPropertyValue('--ink').trim()||'#111',acc:cs.getPropertyValue('--accent').trim()||'#2b4cf0',
    muted:cs.getPropertyValue('--faint').trim()||'#888',bg:cs.getPropertyValue('--surface').trim()||'#fff',line:cs.getPropertyValue('--line-2').trim()||'rgba(0,0,0,.15)'}}
  function size(){var r=cv.getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);W=Math.max(1,r.width);H=Math.max(1,r.height);
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed();if(kind==='flow')ctx.clearRect(0,0,W,H);if(!loopOK())frame(performance.now())}
  var rnd=function(a){var x=Math.sin(a*127.1)*43758.5453;return x-Math.floor(x)};
  function seed(){
    parts=[];
    if(kind==='structure'){
      var cols=4,rows=7,pad=W*.07,docW=W*.30,docX=pad,docY=H*.14,docH=H*.72,tabX=W*.50,tabW=W*.50-pad,tabY=H*.18,rowH=(H*.64)/rows,cw=tabW/cols;
      parts.layout={docX:docX,docY:docY,docW:docW,docH:docH,tabX:tabX,tabY:tabY,tabW:tabW,rowH:rowH,cw:cw,rows:rows,cols:cols};
      for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var k=r*cols+c;
        var sw=10+rnd(k+3.1)*28;parts.push({sx:docX+12+rnd(k+1)*(docW-24-sw),sy:docY+14+rnd(k+7.3)*(docH-28),sw:sw,
          tx:tabX+c*cw+6,ty:tabY+r*rowH+rowH*.32,tw:cw-12-(c===0?0:rnd(k+9)*cw*.35),r:r,c:c,d:(c*.12+r*.05)})}
    }else if(kind==='grid'){
      var gap=W<500?26:30;for(var y=gap/2;y<H;y+=gap)for(var x=gap/2;x<W;x+=gap)parts.push({x:x,y:y});
      parts.gap=gap;parts.sig=[];for(var i=0;i<7;i++)parts.sig.push({row:Math.floor(rnd(i+2)*(H/gap)),sp:.08+rnd(i+5)*.12,off:rnd(i+8),dir:i%2?1:-1,vert:i%3===0});
    }else{
      var n=Math.round(Math.min(220,W*H/2600));for(var j=0;j<n;j++)parts.push({x:rnd(j+1.7)*W,y:rnd(j+4.2)*H,a:rnd(j+9.9)});
      seeded=true;
    }
  }
  var ease=function(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
  function frame(now){
    var t=(now-t0)/1000;
    if(kind==='structure'){
      ctx.clearRect(0,0,W,H);var L=parts.layout;if(!L)return;
      var cyc=8,ph=reduced()?3.6:(t%cyc);
      // frames
      ctx.lineWidth=1;ctx.strokeStyle=col.line;
      rr(L.docX,L.docY,L.docW,L.docH,10);ctx.stroke();
      ctx.globalAlpha=.6;for(var g=0;g<=L.rows;g++){ctx.beginPath();ctx.moveTo(L.tabX,L.tabY+g*L.rowH-L.rowH*.18);ctx.lineTo(L.tabX+L.tabW,L.tabY+g*L.rowH-L.rowH*.18);ctx.stroke()}
      ctx.globalAlpha=1;
      // validation sweep row
      var sweepOn=ph>3.4&&ph<6.2,sr=Math.floor(((ph-3.4)/2.8)*L.rows);
      parts.forEach(function(p){
        var k=Math.min(1,Math.max(0,ph<5.9?(ph-1-p.d)/1.6:1-(ph-6.6-p.d*.5)/1.0));var e=ease(k);
        var jx=Math.sin(t*1.3+p.sx)*1.6*(1-e),jy=Math.cos(t*1.1+p.sy)*1.6*(1-e);
        var x=p.sx+(p.tx-p.sx)*e+jx,y=p.sy+(p.ty-p.sy)*e+jy,w=p.sw+(p.tw-p.sw)*e,h=5+e*3;
        var hot=sweepOn&&p.r===sr;
        ctx.fillStyle=hot?col.acc:(p.c===0&&e>.9?col.ink:col.muted);ctx.globalAlpha=hot?1:(.45+e*.4);
        rr(x,y,w,h,h/2);ctx.fill();
      });
      ctx.globalAlpha=1;
      if(sweepOn){var y0=L.tabY+sr*L.rowH-L.rowH*.18;ctx.fillStyle=col.acc;ctx.globalAlpha=.08;ctx.fillRect(L.tabX,y0,L.tabW,L.rowH);ctx.globalAlpha=1;
        ctx.beginPath();ctx.arc(L.tabX+L.tabW-8,y0+L.rowH/2,4,0,7);ctx.fill()}
      // connector
      var ax=L.docX+L.docW+14,bx=L.tabX-14,ay=H/2;ctx.strokeStyle=col.line;ctx.setLineDash([3,5]);ctx.beginPath();ctx.moveTo(ax,ay);ctx.lineTo(bx,ay);ctx.stroke();ctx.setLineDash([]);
      var mv=reduced()?.5:((t*.6)%1);ctx.fillStyle=col.acc;ctx.beginPath();ctx.arc(ax+(bx-ax)*mv,ay,3,0,7);ctx.fill();
    }else if(kind==='grid'){
      ctx.clearRect(0,0,W,H);var gp=parts.gap;
      parts.forEach(function(p){var d=Math.hypot(p.x-px,p.y-py),near=Math.max(0,1-d/160);
        ctx.fillStyle=near>.02?col.acc:col.muted;ctx.globalAlpha=.28+near*.7;ctx.beginPath();ctx.arc(p.x,p.y,1.3+near*1.6,0,7);ctx.fill()});
      ctx.globalAlpha=1;
      (parts.sig||[]).forEach(function(s){var prog=reduced()?s.off:((t*s.sp+s.off)%1);if(s.dir<0)prog=1-prog;
        var x,y,len=90;ctx.lineWidth=2;
        if(s.vert){x=(Math.floor(s.off*W/gp)+.5)*gp;y=prog*(H+len)-len;var gr=ctx.createLinearGradient(x,y,x,y+len);gr.addColorStop(0,'transparent');gr.addColorStop(1,col.acc);ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+len);ctx.stroke()}
        else{y=(s.row+.5)*gp;x=prog*(W+len)-len;var g2=ctx.createLinearGradient(x,y,x+len,y);g2.addColorStop(0,'transparent');g2.addColorStop(1,col.acc);ctx.strokeStyle=g2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+len,y);ctx.stroke()}
      });
    }else{
      // flow: fade previous frame toward surface colour to leave soft trails
      ctx.globalCompositeOperation='source-over';ctx.globalAlpha=reduced()?1:.06;ctx.fillStyle=col.bg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;
      var steps=reduced()?60:1;
      for(var s2=0;s2<steps;s2++){var tt=reduced()?s2*.05:t;
      parts.forEach(function(p,i){
        var a=Math.sin(p.x*.0042+tt*.25)*Math.cos(p.y*.0051-tt*.2)*Math.PI*2+p.a;
        var dx=p.x-px,dy=p.y-py,dd=dx*dx+dy*dy;if(dd<14400){a+=Math.atan2(dy,dx)*.6}
        var nx=p.x+Math.cos(a)*.9,ny=p.y+Math.sin(a)*.9;
        ctx.strokeStyle=i%9===0?col.acc:col.muted;ctx.globalAlpha=i%9===0?.55:.22;ctx.lineWidth=1.1;
        ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke();
        p.x=nx;p.y=ny;if(p.x<-4||p.x>W+4||p.y<-4||p.y>H+4){p.x=Math.random()*W;p.y=Math.random()*H}
      })}
      ctx.globalAlpha=1;
    }
  }
  function rr(x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)}
  function loopOK(){return vis&&!document.hidden&&!reduced()}
  function loop(now){frame(now);raf=loopOK()?requestAnimationFrame(loop):0}
  function kick(){if(!raf&&loopOK())raf=requestAnimationFrame(loop)}
  readCol();
  var ro=new ResizeObserver(size);ro.observe(cv);
  var io=new IntersectionObserver(function(es){vis=es[0].isIntersecting;kick()});io.observe(cv);
  var onVis=function(){kick()};document.addEventListener('visibilitychange',onVis);
  var onTheme=function(){readCol();if(kind==='flow'){ctx.fillStyle=col.bg;ctx.globalAlpha=1;ctx.fillRect(0,0,W,H)}if(!loopOK())frame(performance.now())};window.addEventListener('themechange',onTheme);
  var host=cv.parentElement;
  var pm=function(e){var r=cv.getBoundingClientRect();px=e.clientX-r.left;py=e.clientY-r.top};var pl=function(){px=py=-9999};
  host.addEventListener('pointermove',pm);host.addEventListener('pointerleave',pl);
  return function(){cancelAnimationFrame(raf);raf=0;ro.disconnect();io.disconnect();document.removeEventListener('visibilitychange',onVis);window.removeEventListener('themechange',onTheme);
    host.removeEventListener('pointermove',pm);host.removeEventListener('pointerleave',pl)};
}

$('#yr').textContent=new Date().getFullYear();
function fillLinks(){$('#footLinks').innerHTML='<li><a href="mailto:'+esc(SITE.email||'')+'">Email</a></li>'+(SITE.links||[]).map(function(l){return '<li><a href="'+esc(l.u)+'" target="_blank" rel="noopener">'+esc(l.k)+'</a></li>'}).join('')}
var started=false;
function start(){if(started)return;started=true;fillLinks();route()}
var timer=setTimeout(start,1500);
if(window.fetch){fetch('content.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(d){
  if(d&&typeof d==='object'){SITE=d}
  clearTimeout(timer);if(!started)start();else{fillLinks();render(routeKey())}
}).catch(function(){clearTimeout(timer);start()})}else{start()}
})();
