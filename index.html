<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tarun Inala — Business Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ---------- THEME TOKENS ---------- */
:root{
  --bg:#F3F4F7; --s1:#FFFFFF; --s2:#ECEEF3; --s3:#E2E5EC;
  --line:#D9DCE4; --line2:#C6CAD5;
  --tx:#0E1015; --mu:#575C6C; --dim:#9AA0AE;
  --acc:#00E08F; --acc-on:#04130C; --acc-t:#007A52; --acc-tint:rgba(0,168,110,.10); --acc-line:rgba(0,140,92,.35);
  --lime-t:#6B7A00; --lime-tint:rgba(150,170,0,.13); --lime-line:rgba(120,140,0,.35);
  --hdr:rgba(243,244,247,.82); --shine:rgba(255,255,255,.9); --shadow:0 24px 48px -24px rgba(20,25,40,.25);
  --glow:rgba(0,224,143,.16); --g1:rgba(0,224,143,.34); --g2:rgba(90,255,190,.26); --g3:rgba(150,190,0,.16);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08090C; --s1:#0E1015; --s2:#16181F; --s3:#1B1E26;
    --line:#252833; --line2:#343847;
    --tx:#F5F6FA; --mu:#8A8F9E; --dim:#4C5061;
    --acc:#00F5A0; --acc-on:#08090C; --acc-t:#00F5A0; --acc-tint:rgba(0,245,160,.10); --acc-line:rgba(0,245,160,.30);
    --lime-t:#E8FF59; --lime-tint:rgba(232,255,89,.10); --lime-line:rgba(232,255,89,.30);
    --hdr:rgba(8,9,12,.78); --shine:rgba(255,255,255,.06); --shadow:0 24px 48px -12px rgba(0,0,0,.85);
    --glow:rgba(0,245,160,.10); --g1:rgba(0,245,160,.30); --g2:rgba(0,245,160,.14); --g3:rgba(232,255,89,.10);
  }
}
:root[data-theme="dark"]{
  --bg:#08090C; --s1:#0E1015; --s2:#16181F; --s3:#1B1E26;
  --line:#252833; --line2:#343847;
  --tx:#F5F6FA; --mu:#8A8F9E; --dim:#4C5061;
  --acc:#00F5A0; --acc-on:#08090C; --acc-t:#00F5A0; --acc-tint:rgba(0,245,160,.10); --acc-line:rgba(0,245,160,.30);
  --lime-t:#E8FF59; --lime-tint:rgba(232,255,89,.10); --lime-line:rgba(232,255,89,.30);
  --hdr:rgba(8,9,12,.78); --shine:rgba(255,255,255,.06); --shadow:0 24px 48px -12px rgba(0,0,0,.85);
  --glow:rgba(0,245,160,.10); --g1:rgba(0,245,160,.30); --g2:rgba(0,245,160,.14); --g3:rgba(232,255,89,.10);
}

/* ---------- BASE ---------- */
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/22px "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s;min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3,.head{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0}
::selection{background:var(--acc);color:var(--acc-on)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.lbl{font-size:10px;line-height:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:500}
.lbl.acc{color:var(--acc-t)} .lbl.lime{color:var(--lime-t)}
.display{font-size:clamp(38px,7vw,64px);line-height:1.06;letter-spacing:-.03em;font-weight:800;text-wrap:balance}
.display em{font-style:normal;color:var(--acc-t)}
.h2{font-size:clamp(26px,4vw,36px);line-height:1.2;letter-spacing:-.02em;font-weight:700}
.lede{color:var(--mu);font-size:15px;line-height:26px;max-width:640px;margin:20px 0 0}
.mono-cap{font-size:12px;color:var(--mu)}

/* ---------- COMPONENTS ---------- */
.card{background:var(--s1);border:1px solid var(--line);border-radius:16px;box-shadow:inset 0 1px 0 0 var(--shine);transition:border-color .2s,transform .2s,background .25s}
.card.hov:hover{border-color:var(--line2);transform:translateY(-2px)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 12px;border-radius:999px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;background:var(--s2);border:1px solid var(--line);color:var(--mu);white-space:nowrap}
.chip.g{background:var(--acc-tint);border-color:var(--acc-line);color:var(--acc-t)}
.chip.l{background:var(--lime-tint);border-color:var(--lime-line);color:var(--lime-t)}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--s1);box-shadow:inset 0 1px 0 0 var(--shine);transition:box-shadow .2s,border-color .2s,transform .15s}
.btn:hover{border-color:var(--line2)}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--acc);color:var(--acc-on);border-color:transparent;font-weight:700}
.btn.p:hover{box-shadow:0 0 24px -2px var(--acc)}
.btn.sm{height:34px;padding:0 16px;font-size:11px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--s1);border:1px solid var(--line);box-shadow:inset 0 1px 0 0 var(--shine);transition:border-color .2s}
.iconbtn:hover{border-color:var(--acc-line)}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--s2);color:var(--mu);font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;transition:all .2s}
.fbtn:hover{color:var(--tx)}
.fbtn.on{background:var(--acc);border-color:transparent;color:var(--acc-on);font-weight:700}
:focus-visible{outline:2px solid var(--acc-t);outline-offset:2px}

/* ---------- HEADER ---------- */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--hdr);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);transition:background .25s}
.hdr .in{max-width:1200px;margin:0 auto;padding:0 24px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--s2);border:1px solid var(--line2);display:grid;place-items:center;font-family:"Plus Jakarta Sans",sans-serif;font-weight:800;font-size:16px;color:var(--acc-t);box-shadow:inset 0 1px 0 0 var(--shine)}
.brand b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
nav.pill{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--s2);border:1px solid var(--line)}
nav.pill a{padding:6px 16px;border-radius:999px;font-size:12px;letter-spacing:.04em;color:var(--mu);font-weight:500;transition:color .2s}
nav.pill a:hover{color:var(--tx)}
nav.pill a.on{background:var(--s1);color:var(--tx);box-shadow:inset 0 1px 0 0 var(--shine),0 0 0 1px var(--line2)}
.hdr-r{display:flex;align-items:center;gap:12px}
.mnav{display:none}
@media (max-width:860px){
  .hdr .in{height:60px;padding:0 16px}
  nav.pill.d{display:none}
  .hide-m{display:none}
  .mnav{display:block;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .mnav::-webkit-scrollbar{display:none}
  .mnav .row{display:flex;gap:6px;padding:8px 16px;width:max-content;min-width:100%}
  .mnav a{padding:6px 16px;border-radius:999px;font-size:12px;color:var(--mu);border:1px solid transparent;font-weight:500}
  .mnav a.on{background:var(--s1);color:var(--tx);border-color:var(--line2)}
  .wrap{padding:0 16px}
}

/* ---------- LAYOUT ---------- */
main{display:block;min-height:70vh;position:relative}
.bg-glow{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-glow i{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform}
.bg-glow i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--g1),transparent 68%);animation:gl1 32s ease-in-out infinite alternate}
.bg-glow i:nth-child(2){width:60vmax;height:60vmax;right:-25vmax;top:10vh;background:radial-gradient(circle,var(--g2),transparent 68%);animation:gl2 40s ease-in-out infinite alternate}
.bg-glow i:nth-child(3){width:55vmax;height:55vmax;left:15vw;bottom:-35vmax;background:radial-gradient(circle,var(--g1),transparent 68%);animation:gl3 36s ease-in-out infinite alternate}
.bg-glow i:nth-child(4){width:40vmax;height:40vmax;left:40vw;top:20vh;background:radial-gradient(circle,var(--g3),transparent 65%);animation:gl4 28s ease-in-out infinite alternate}
.bg-glow::after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 42%,var(--g2) 50%,transparent 58%);opacity:.55;animation:shim 24s ease-in-out infinite alternate}
@keyframes gl1{to{transform:translate(28vw,22vh) scale(1.2)}}
@keyframes gl2{to{transform:translate(-30vw,20vh) scale(1.15)}}
@keyframes gl3{to{transform:translate(30vw,-18vh) scale(1.25)}}
@keyframes gl4{from{transform:translate(-15vw,-8vh) scale(.9)}to{transform:translate(18vw,14vh) scale(1.2)}}
@keyframes shim{from{transform:translateX(-28%)}to{transform:translateX(28%)}}
.mode{display:flex;padding:3px;border-radius:999px;background:var(--s2);border:1px solid var(--line)}
.mode button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--mu);transition:all .2s}
.mode button.on{background:var(--acc);color:var(--acc-on)}
@media (max-width:1100px){.hide-l{display:none}}
@media (max-width:520px){.brand b{display:none}.mode button{padding:6px 11px}}
main>*{position:relative;z-index:1;animation:up .5s ease both}
main>*:nth-child(2){animation-delay:.06s} main>*:nth-child(3){animation-delay:.12s} main>*:nth-child(4){animation-delay:.18s}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main>*,.dot,.bg-glow i,.bg-glow::after{animation:none}*{transition:none!important}}
.hero{padding-top:56px;padding-bottom:40px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.sec{padding-top:56px}
.sec-h{margin-bottom:28px;display:flex;flex-direction:column;gap:8px}
.sec-h.row{flex-direction:row;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.banner{background:var(--lime-tint);border-bottom:1px solid var(--lime-line);color:var(--lime-t);font-size:11px;letter-spacing:.04em}
.banner .in{max-width:1200px;margin:0 auto;padding:8px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.banner button{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:11px}

/* ---------- WORK ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.stat{padding:22px 24px 20px;display:flex;flex-direction:column;gap:20px}
.metric{font-size:44px;line-height:52px;letter-spacing:-.03em;font-weight:500;color:var(--acc-t)}
.metric small{font-size:14px;color:var(--tx);margin-left:6px;letter-spacing:0}
.cap{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em}
.feat{display:grid;grid-template-columns:1.05fr 1fr;gap:0;overflow:hidden}
.feat .txt{padding:36px;display:flex;flex-direction:column;gap:18px;justify-content:center}
.feat .vis{min-height:340px;position:relative;border-left:1px solid var(--line)}
.feat h3{font-size:clamp(24px,3vw,32px);line-height:1.2;letter-spacing:-.02em;font-weight:700}
.feat p,.pj p{margin:0;color:var(--mu)}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mets div{background:var(--s2);padding:14px 16px}
.mets b{display:block;font-size:20px;font-weight:500;color:var(--acc-t);margin-top:4px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.pj{padding:28px;display:flex;flex-direction:column;gap:14px}
.pj h3{font-size:22px;line-height:30px;letter-spacing:-.015em;font-weight:600}
.pj .vis{aspect-ratio:520/360;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-top:6px;position:relative}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.vis svg,.mvis svg{width:100%;height:100%;display:block}
.mvis{aspect-ratio:520/360;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--s2)}
.feat .vis{background:var(--s2)}
.mc{padding:24px;display:flex;flex-direction:column;gap:12px}
.mc h3{font-size:19px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.mc p{margin:0;color:var(--mu)}
.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}
.role{padding:24px 26px;display:flex;flex-direction:column;gap:8px}
.role+.role{margin-top:14px}
.role .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.role h3{font-size:19px;font-weight:600;letter-spacing:-.01em}
.role p{margin:0;color:var(--mu)}
.hon{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.hon+.hon{margin-top:12px}
.hon .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--acc-tint);border:1px solid var(--acc-line);color:var(--acc-t);flex:none}
.hon div.t{flex:1;min-width:0}
.hon b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-weight:600;font-size:15px}
.cta{margin-top:64px;padding:36px;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;background:linear-gradient(120deg,var(--acc-tint),transparent 60%),var(--s1)}
.cta h3{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em;max-width:520px}

/* ---------- POETRY ---------- */
.pfeat{padding:44px;display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;background:linear-gradient(135deg,var(--acc-tint),transparent 55%),var(--s1)}
.pfeat .q{font-family:"Plus Jakarta Sans",sans-serif;font-size:clamp(22px,3vw,30px);line-height:1.4;font-weight:600;letter-spacing:-.015em}
.pfeat .q span{display:block}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.poem{padding:26px;display:flex;flex-direction:column;gap:14px;text-align:left;width:100%;min-height:250px}
.poem .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.poem h3{font-size:22px;line-height:30px;letter-spacing:-.015em;font-weight:600}
.poem .ex{color:var(--mu);white-space:pre-line;flex:1}
.poem .ft{display:flex;justify-content:space-between;align-items:center;color:var(--mu)}
.poem .ft b{color:var(--tx);font-weight:500;display:inline-flex;gap:6px;align-items:center}

/* ---------- PHOTOGRAPHY ---------- */
.pg{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
.ph{overflow:hidden;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;width:100%}
.ph .img{position:relative;flex:1;min-height:280px;overflow:hidden;background:var(--s2)}
.ph .img svg,.ph .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.ph:hover .img svg,.ph:hover .img img{transform:scale(1.04)}
.ph .badge{position:absolute;top:14px;left:14px;display:flex;gap:6px;z-index:2}
.ph .badge .chip{background:rgba(8,9,12,.62);border-color:rgba(255,255,255,.18);color:#fff;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ph .cap2{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 16px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);color:#fff;z-index:2}
.ph .cap2 .lbl{color:rgba(255,255,255,.75)}
.ph .cap2 b{display:block;font-family:"Plus Jakarta Sans",sans-serif;font-size:20px;font-weight:600;letter-spacing:-.01em}
.ph .meta{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;font-size:11px;color:var(--mu);border-top:1px solid var(--line);background:var(--s1);flex-wrap:wrap}
.ph .meta em{font-style:normal;color:var(--lime-t)}
.s-a{grid-column:span 4}.s-b{grid-column:span 2}.s-c{grid-column:span 2}.s-d{grid-column:span 3}
.ph.tall .img{min-height:420px}
.ribbon{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 18px;border-radius:12px;background:var(--s1);border:1px solid var(--line);margin-bottom:20px;font-size:11px;color:var(--mu)}
.ribbon span.sep{color:var(--dim)}
.hint{position:absolute;right:14px;top:14px;z-index:2;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.7);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px}

/* ---------- CONTACT ---------- */
.cgrid{display:grid;grid-template-columns:1fr 1.25fr;gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.box{padding:24px}
.email{font-size:20px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:14px}
.links a{height:56px;border-radius:10px;background:var(--s2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);transition:all .2s}
.links a:hover{color:var(--acc-t);border-color:var(--acc-line)}
.form{padding:30px;display:flex;flex-direction:column;gap:22px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld{display:flex;flex-direction:column;gap:8px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font:inherit;box-shadow:inset 0 2px 4px rgba(0,0,0,.12);transition:border-color .2s,box-shadow .2s}
input::placeholder,textarea::placeholder{color:var(--dim)}
input:focus,textarea:focus{outline:none;border-color:var(--acc-t);box-shadow:0 0 12px var(--acc-tint)}
textarea{min-height:140px;resize:vertical}
.err{color:#e5484d;font-size:11px;min-height:16px}
.ok{padding:22px;border-radius:12px;background:var(--acc-tint);border:1px solid var(--acc-line);color:var(--tx)}

/* ---------- FOOTER ---------- */
footer{position:relative;z-index:1;margin-top:80px;border-top:1px solid var(--line);background:var(--s1);transition:background .25s}
footer .g{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px;padding:44px 0 28px}
footer ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px;color:var(--mu)}
footer ul a:hover{color:var(--acc-t)}
footer .bt{border-top:1px solid var(--line);padding:18px 0 28px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}

/* ---------- OVERLAY ---------- */
#ov{position:fixed;inset:0;z-index:100;display:none;background:rgba(4,5,8,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);overflow-y:auto}
#ov.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{max-width:760px;margin:0 auto;background:var(--s2);border:1px solid var(--line2);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.sheet.wide{max-width:1000px}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sh-b{padding:36px 40px 40px}
.sh-f{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line);gap:10px}
.poemtxt{font-family:"Plus Jakarta Sans",sans-serif;font-size:clamp(19px,2.6vw,24px);line-height:1.65;font-weight:500;margin-top:24px}
.poemtxt p{margin:0}
.lb{display:grid;grid-template-columns:1.4fr 1fr}
.lb .art{position:relative;min-height:440px;background:var(--s3)}
.lb .art svg,.lb .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lb .info{padding:28px;display:flex;flex-direction:column;gap:18px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kv div{background:var(--s1);padding:12px 14px}
.kv b{display:block;font-weight:500;margin-top:2px}

@media (max-width:900px){
  .stats,.mgrid{grid-template-columns:1fr}
  .feat,.two,.cols,.pfeat,.cgrid,.lb{grid-template-columns:1fr}
  .feat .vis{border-left:0;border-top:1px solid var(--line);min-height:240px}
  .feat .txt,.pfeat{padding:26px}
  .pgrid{grid-template-columns:1fr}
  .pg{grid-template-columns:1fr 1fr}
  .s-a,.s-b,.s-c,.s-d{grid-column:span 2}
  .ph .img,.ph.tall .img{min-height:300px}
  .f2{grid-template-columns:1fr}
  footer .g{grid-template-columns:1fr}
  .sh-b{padding:26px 22px 30px}
  .lb .art{min-height:320px}
  .mets .l{font-size:9px}
}
@media (min-width:901px) and (max-width:1100px){.pgrid,.mgrid{grid-template-columns:1fr 1fr}}

}
var lastFocus=null;
function showOv(){lastFocus=document.activeElement;var o=$('#ov');o.classList.add('on');o.scrollTop=0;document.body.style.overflow='hidden';var c=$('#ov [data-a="close"]');if(c)c.focus()}
function closeOv(){var o=$('#ov');if(!o.classList.contains('on'))return;o.classList.remove('on');o.innerHTML='';document.body.style.overflow='';cur={t:null,i:0};if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}
function step(d){
  if(cur.t==='poem'){var n=SITE.poems.length;openPoem(SITE.poems[(cur.i+d+n)%n].id)}
  else if(cur.t==='photo'){var m=SITE.photos.length;openPhoto(SITE.photos[(cur.i+d+m)%m].id)}
}

/* ---------- EVENTS ---------- */
document.addEventListener('click',function(e){
  if(e.target===$('#ov')){closeOv();return}
  var el=e.target.closest('[data-a]'); if(!el)return;
  var a=el.dataset.a, v=el.dataset.v;
  if(a==='mode'){location.hash='#/'+MODES[v][0]}
  else if(a==='poem'){openPoem(el.dataset.id)}
  else if(a==='photo'){openPhoto(el.dataset.id)}
  else if(a==='close'){closeOv()}
  else if(a==='prev'){step(-1)}
  else if(a==='next'){step(1)}
  else if(a==='pfilter'){poemFilter=v;document.querySelectorAll('#pf .fbtn').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});$('#pbody').innerHTML=poemsBody()}
  else if(a==='pcat'){photoFilter=v;document.querySelectorAll('#phf .fbtn').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});$('#phbody').innerHTML=photosBody()}
  else if(a==='topic'){document.querySelectorAll('#topics .fbtn').forEach(function(b){b.classList.toggle('on',b===el)})}
  else if(a==='copy-email'){
    var done=function(){var l=$('#cplbl');if(l){l.textContent='Copied';setTimeout(function(){l.textContent='Copy'},1600)}};
    try{navigator.clipboard.writeText(SITE.email).then(done,done)}catch(x){done()}
  }
  else if(a==='send'){
    var n=$('#fn').value.trim(), m=$('#fe').value.trim(), t=$('#fm').value.trim(), err=$('#ferr');
    var tp=$('#topics .fbtn.on'); tp=tp?tp.dataset.v:'Hello';
    if(!n||!/^\S+@\S+\.\S+$/.test(m)||!t){err.textContent='Please add your name, a valid email and a message.';return}
    sentMsg='mailto:'+SITE.email+'?subject='+encodeURIComponent(tp+' — from '+n)+'&body='+encodeURIComponent(t+'\n\n— '+n+' ('+m+')');
    $('#formwrap').innerHTML=formHTML();
  }
  else if(a==='again'){sentMsg=null;$('#formwrap').innerHTML=formHTML()}
});
document.addEventListener('keydown',function(e){
  if(!$('#ov').classList.contains('on'))return;
  if(e.key==='Escape')closeOv();
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')step(1);
});

/* ---------- FOOTER + INIT ---------- */
function boot(){
$('#f-links').innerHTML=SITE.links.map(function(l){return '<li><a href="'+l.u+'">'+l.k+'</a></li>'}).join('')+'<li><a href="mailto:'+SITE.email+'">Email</a></li>';
$('#copy').textContent='© '+new Date().getFullYear()+' Tarun Inala. All rights reserved.';
paintToggle();
route();
}
/* Load content.json (edit that file, or sync it from Notion). If it can't be loaded, the built-in copy above is used. */
(function(){
  var done=false; function go(){ if(done) return; done=true; boot(); }
  try{
    fetch('content.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()})
      .then(function(d){ if(d&&d.work&&d.poems&&d.photos){ SITE=d; } }).catch(function(){}).then(go);
    setTimeout(go,2500);
  }catch(e){ go(); }
})();
</script>
</body>
